name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with the in-box .NET Framework compiler
        shell: pwsh
        run: ./build/build.ps1

      - name: Generate preset save files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./dist/PBZKeyForge-cli.exe --gen-presets ./samples/vanilla-base.sav ./presets-out
          if ($LASTEXITCODE -ne 0) { throw "Preset generation failed" }
          Get-ChildItem ./presets-out | Select-Object Name, Length | Format-Table -AutoSize

      - name: Verify preset share format and device scopes
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /out:dist\PresetShareTests.exe /r:dist\PBZKeyForge.exe /r:System.Core.dll tests\PresetShareTests.cs
          if ($LASTEXITCODE -ne 0) { throw "Preset share test compilation failed" }
          ./dist/PresetShareTests.exe ./samples/vanilla-base.sav ./dist/preset-share-check
          if ($LASTEXITCODE -ne 0) { throw "Preset share checks failed" }

      - name: Verify preset files match the editor
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /out:dist\PresetPackageTests.exe /r:dist\PBZKeyForge.exe /r:System.Core.dll tests\PresetPackageTests.cs
          if ($LASTEXITCODE -ne 0) { throw "Preset package test compilation failed" }
          ./dist/PresetPackageTests.exe ./samples/vanilla-base.sav ./presets-out ./dist/preset-package-check
          if ($LASTEXITCODE -ne 0) { throw "Preset files differ from the editor" }

      - name: Verify offline and missing-controller editing
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /out:dist\OfflineControllerTests.exe /r:dist\PBZKeyForge.exe /r:System.Core.dll tests\OfflineControllerTests.cs
          if ($LASTEXITCODE -ne 0) { throw "Offline test compilation failed" }
          ./dist/OfflineControllerTests.exe ./samples/vanilla-base.sav ./dist/offline-controller-check
          if ($LASTEXITCODE -ne 0) { throw "Offline editing checks failed" }

      - name: Verify round-trip on the shipped base file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & ./dist/PBZKeyForge-cli.exe --selftest ./samples/vanilla-base.sav
          $text = ($out | Out-String)
          Write-Host $text
          if ($text -notmatch "roundtrip=IDENTICAL") { throw "GVAS round-trip is not byte-identical" }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"

          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item dist\PBZKeyForge.exe     pkg
          Copy-Item README.md                pkg
          Copy-Item LICENSE                  pkg
          Copy-Item THIRD-PARTY-NOTICES.md    pkg
          Copy-Item presets-out              pkg\presets -Recurse
          Compress-Archive -Path pkg\* -DestinationPath "PBZKeyForge-$tag.zip"

          # Save-file-only package for players who do not want to run an executable.
          New-Item -ItemType Directory -Path pkg-sav | Out-Null
          Copy-Item presets-out\*.sav pkg-sav
          Copy-Item presets-out\PRESETS.md pkg-sav
          Copy-Item README.md pkg-sav
          Compress-Archive -Path pkg-sav\* -DestinationPath "PBZKeyForge-$tag-presets-only.zip"

          Get-ChildItem *.zip | Select-Object Name, Length | Format-Table -AutoSize

      - name: Release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          Copy-Item $notes release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PBZKeyForge-${{ github.ref_name }}.zip
            PBZKeyForge-${{ github.ref_name }}-presets-only.zip
          body_path: release-notes.md

